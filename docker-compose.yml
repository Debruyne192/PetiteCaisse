services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petitecaisse_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=petitecaisse
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret

  db:
    image: postgres:16-alpine
    container_name: petitecaisse_db
    restart: always
    environment:
      POSTGRES_DB: petitecaisse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
